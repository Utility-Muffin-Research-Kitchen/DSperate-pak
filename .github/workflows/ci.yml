name: ci

# Builds the pinned DSperate binary, packages the pak, and validates it against
# the content-pak contract at a pinned leaf-contracts SHA.
#
# Nothing here assumes a UMRK workspace layout: the runner starts from a bare
# clone of this repository, exactly like an outside contributor's machine.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Pin the contract, not a branch. A moving contract that silently changes what
  # "valid" means is the thing this pin exists to prevent; bumping it is a
  # reviewed commit here.
  CONTRACT_REF: f7c25c6b27ac79beb9ee08b0b4fdde54375df081

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out the pinned contract
        uses: actions/checkout@v4
        with:
          repository: Utility-Muffin-Research-Kitchen/leaf-contracts
          ref: ${{ env.CONTRACT_REF }}
          path: .contract

      - name: Validate pak.json against CONTENT-1
        run: make validate CONTRACT_DIR="$PWD/.contract"

      - name: Check wrapper, MLP1 pad profile, PGO lock, manifest/lock and docs
        run: make test-wrapper test-profile test-pgo test-lock test-docs

      - name: Replay the pinned standalone-ra-account-v1 fixtures and bridge fault tests
        run: make test-ra-account CONTRACT_DIR="$PWD/.contract"

      - name: The validator's ra-account-v1 record rule
        run: make test-validate-pak CONTRACT_DIR="$PWD/.contract"

      - name: Refuse a launch.sh
        run: |
          # This repository is a PURE content pak. A launch.sh would quietly
          # turn it into a hybrid and change how both the storefront and the
          # launcher treat it.
          if [ -e pak/launch.sh ]; then
            echo "pak/launch.sh present: this is meant to be a pure content pak" >&2
            exit 1
          fi

      - name: Refuse a path that escapes the repository
        run: |
          # The whole point of this repository is that someone can clone it and
          # build. A '../' in the build system means they cannot.
          if grep -REn '\.\./(Cores-spruce|Leaf|Jawaka|Catastrophe|umrk-workspace|mlp1-toolchain|Fun-Drastic)' \
               Makefile standalone scripts tests .github 2>/dev/null; then
            echo "build system references a sibling checkout" >&2
            exit 1
          fi
          echo "no sibling-checkout references"

  build:
    # Native arm64: an independent build on the device architecture. The
    # toolchain image is a cross-compiler, so the host variant does not change
    # the target where it matters, but building on arm64 removes any doubt.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Build the pinned DSperate binary (strict PGO)
        run: make standalone

      - name: Archive CLI checks against the real binary
        run: make test-archive-cli

      - name: Package and hash
        run: make dist-pakrat

      - name: Corresponding source (GPLv3)
        run: make dist-source

      - name: --version from the git build and a rebuild from the source archive
        run: make test-version

      - name: Archives are byte-deterministic
        run: make test-archives

      - name: Record artifact hashes
        run: |
          sha256sum build/standalone/dsperate build/standalone/dsperate-notice \
            build/dist/DSperate.mlp1.pak.zip build/dist/dsperate-corresponding-source.tar.gz

      - name: Check out the pinned contract
        uses: actions/checkout@v4
        with:
          repository: Utility-Muffin-Research-Kitchen/leaf-contracts
          ref: ${{ env.CONTRACT_REF }}
          path: .contract

      - name: Validate the PACKAGED pak strictly
        run: |
          python3 scripts/validate-pak.py \
            --contract "$PWD/.contract" \
            --pak build/package/DSperate.pak --packaged

      - uses: actions/upload-artifact@v4
        with:
          name: DSperate-pak
          path: |
            build/dist/DSperate.mlp1.pak.zip
            build/dist/dsperate-corresponding-source.tar.gz
            build/dist/upstream.lock.json
