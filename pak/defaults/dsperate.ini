# DSperate defaults for Leaf on MLP1. Seeded once into
# $USERDATA_PATH/dsperate/dsperate.ini and left alone after that.
#
# These are the values Leaf wants a Nintendo DS standalone session to start
# with. Your own edits here are the user's configuration and are never
# overwritten by a launch or a pak update. Command-line flags and per-game
# files override this file, in that order.

[emu]
# Leaf supervises the emulator process; real-time scheduling is not requested
# by default. Qualify any change against frame time and launcher
# responsiveness before enabling it.
realtime = off

# Keep the generic Leaf quit route (SIGTERM) from writing an auto save state by
# default; the battery save is committed independently.
autosave = false
autoload = false

[cart]
# Cap a single ROM's unpacked ZIP cache. Leaf sets the cache root per game via
# the per-game config file.
cache_mb = 512

[audio]
# The MLP1 has no usable built-in microphone capture here; keep a fake mic
# binding for games that need one.
mic = false

[video]
# One fullscreen window. The MLP1 has a single panel; a second window is not a
# supported configuration in this release.
dual_window = false

[pad]
# The MLP1 pad's SDL mapping names its face buttons by the printed label
# (SDL x is the top, X-labeled button; SDL y is the left, Y-labeled one), but
# DSperate's stock defaults assume position-named SDL buttons. Left alone that
# swaps X and Y. Bind them here explicitly; A and B are already correct.
x = x
y = y
# Tell the emulator the same thing, so the Controls page points its diamond
# pips at the button that is actually bound: position is the Xbox layout SDL
# assumes (x on the left, y on top), printed is this pad's. With this left at
# position the DS X row drew the left pip while the top button did the work.
xy_naming = printed

# The MLP1 has one stick and no R3, so nothing here may name the right stick
# (rightx/righty) or rightstick. The stick is the stylus; the real d-pad stays
# the d-pad. R2 taps the screen and L2 is a second tap; Select+R2 still
# fast-forwards, and the stick click (leftstick) remains available.
stick_dpad = none
stick_face = none
stylus_axis = left
stylus_button = +righttrigger
stylus_button.alt = +lefttrigger
# Conservative raw-pad default. After confirming that your selected pad is
# calibrated, you can set this to 0 globally or in a per-game config. The
# wrapper does not infer calibration from an input roster or an installed file.
stick_deadzone = 12000

[padhotkeys]
# Leaf W4 delivers a lone Menu tap as Guide and keeps Menu chords for Leaf.
# Select+Start is also available for opening the emulator pause menu.
modifier = back
pause = mod+start
pause.alt = guide

# The two default pad chords that used the modifier itself as a member are
# moved, so they can still fire. Quit also stays reachable from DSperate's own
# pause menu, and holding Menu (the launcher's escape) ends the session if the
# emulator stops responding.
layout_next = mod+dpup
quit = mod+dpdown
